services:
  # ─────────────────────────────────────────────
  # PostgreSQL — primary database
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: erm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: employeemanager
      POSTGRES_USER: erm_user
      POSTGRES_PASSWORD: erm_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erm_user -d employeemanager"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Mailpit — local SMTP + web UI for email testing
  # Visit: http://localhost:8025
  # ─────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: erm_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # ─────────────────────────────────────────────
  # Spring Boot backend
  # ─────────────────────────────────────────────
  backend:
    container_name: erm_backend
    build:
      context: ./employeemanager-elite
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/employeemanager
      SPRING_DATASOURCE_USERNAME: erm_user
      SPRING_DATASOURCE_PASSWORD: erm_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_USERNAME: ""
      SPRING_MAIL_PASSWORD: ""
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      # JWT secrets — override in production via secrets/env files
      JWT_SECRET: dev-jwt-secret-change-in-production-must-be-32-chars
      JWT_EXPIRATION_MS: 900000
      JWT_REFRESH_EXPIRATION_MS: 604800000
      # AWS S3 — set real values or leave blank to disable
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────────────
  # Vite dev server (frontend)
  # ─────────────────────────────────────────────
  frontend:
    container_name: erm_frontend
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      # Mount source for hot-reload in dev
      - .:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend

volumes:
  postgres_data:
